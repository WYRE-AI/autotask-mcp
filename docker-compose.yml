

services:
  # Gateway mode. Autotask credentials arrive per request on X-API-Key,
  # X-API-Secret, and X-Integration-Code. Do not set AUTOTASK_USERNAME,
  # AUTOTASK_SECRET, AUTOTASK_INTEGRATION_CODE, or env_file here — that would
  # put static vendor credentials in the container. The project .env is used
  # only for Compose interpolation of CONDUIT_S2S_SECRET. For AUTH_MODE=env,
  # pass AUTOTASK_* on that process instead (see the README).
  autotask-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: autotask-mcp:latest
    container_name: autotask-mcp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-autotask-mcp}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - NODE_ENV=production
    volumes:
      # Mount logs directory for persistence
      - autotask-mcp-logs:/app/logs
    # Health check hits the unauthenticated /health endpoint.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits for production use
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Local stdio development (profile "dev"). This is not the gateway service;
  # it may carry AUTOTASK_* for a single tenant. HTTP gateway deploys use
  # autotask-mcp above, which has no static vendor credentials.
  # Development service - runs once for testing, doesn't restart
  autotask-mcp-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: autotask-mcp:dev
    container_name: autotask-mcp-dev
    working_dir: /app
    restart: "no"  # Don't restart in dev mode
    command: npm run dev
    environment:
      # Development environment variables
      - NODE_ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - LOG_FORMAT=${LOG_FORMAT:-simple}
      
      # Autotask credentials
      - AUTOTASK_USERNAME=${AUTOTASK_USERNAME}
      - AUTOTASK_SECRET=${AUTOTASK_SECRET}
      - AUTOTASK_INTEGRATION_CODE=${AUTOTASK_INTEGRATION_CODE}
      - AUTOTASK_API_URL=${AUTOTASK_API_URL:-}
    env_file:
      - .env
    volumes:
      # Mount source code for hot reload in development
      - .:/app
      - /app/node_modules
      - autotask-mcp-dev-logs:/app/logs
    stdin_open: true
    tty: true

volumes:
  autotask-mcp-logs:
    driver: local
  autotask-mcp-dev-logs:
    driver: local

# Compose interpolates CONDUIT_S2S_SECRET from the project .env (or the shell).
# Leave it empty in the example file; never commit a real value. The gateway
# service does not receive AUTOTASK_* — those headers are injected per request.
# CONDUIT_S2S_SECRET=
# LOG_LEVEL=info
# LOG_FORMAT=json 