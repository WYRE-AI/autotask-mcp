name: PR triage

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  pull-requests: write
  issues: write

jobs:
  spam:
    uses: WYRE-AI/.github/.github/workflows/pr-spam-triage.yml@542c9ed380fff70fab36234fc222cf9e7a076de9  # main
    with:
      # Start in dry-run: label spam-suspected PRs but don't close.
      # Flip to false after a verification window (~1 week) of zero false positives.
      dry-run: true
