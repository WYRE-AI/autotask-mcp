name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline. The build →
# semantic-release → Docker → MCP Registry → security chain (tag-based release
# detection + correct gating) lives in wyre-technology/.github so every *-mcp
# repo stays in lockstep instead of drifting per-repo. PR-time lint/test gating
# is each repo's ci.yml concern; this workflow only runs the release path.
# Caller jobs grant the token scopes the reusable jobs request (a reusable can
# only reduce, never expand, caller-granted scope).
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write  # required by reusable release job: @semantic-release/github success step reads/comments on associated PRs
      packages: write
      id-token: write
      security-events: write
    # Pin includes the `mcpb` job (wyre-technology/.github#43), which restores
    # packing + attaching autotask-mcp.mcpb to the GitHub release. That step
    # existed in this repo's hand-rolled workflow and was dropped by the
    # centralization in #183, so every release from v2.30.0 on shipped with no
    # assets while the README still pointed users at the bundle (#244).
    uses: wyre-technology/.github/.github/workflows/mcp-server-release.yml@8deff2993e933c45856861cb3491d251361a5a8a
    with:
      server-name: autotask-mcp
      image-name: ghcr.io/wyre-technology/autotask-mcp
    secrets: inherit

  deploy:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write
      contents: read
    uses: wyre-technology/.github/.github/workflows/mcp-server-deploy.yml@a61021de876d0fd44dac777fa90f963fea25b0c3
    with:
      vendor-slug: autotask
      image-name: ghcr.io/wyre-technology/autotask-mcp
      digest: ${{ needs.release.outputs.digest }}
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
